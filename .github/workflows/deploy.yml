name: Build & Push to ECR

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 337392631707.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: psudo
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Set version environment variables
        run: |
          echo "REACT_APP_GIT_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "REACT_APP_BUILD_DATE=$(TZ='America/New_York' date '+%m/%d %H:%M')" >> "$GITHUB_ENV"

      - name: Build WASM package (lib/pkg)
        run: pnpm run wasm-build

      - name: Install dependencies and build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        run: |
          docker build --platform linux/amd64 -t psudo .
          docker tag psudo:latest "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Trigger App Runner deployment
        run: |
          aws apprunner start-deployment \
            --service-arn arn:aws:apprunner:us-east-1:337392631707:service/psudo-app/8a7ea82b8def4c1fab6efc69d4314cf5 \
            --region "$AWS_REGION"
