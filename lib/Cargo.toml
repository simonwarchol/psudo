[package]
name = "psudo"
version = "0.16.0"
authors = ["Simon Warchol <simonwarchol@g.harvard.edu>"]
edition = "2018"
license = "MIT"
description = "Palette optimization for multi-channel microscopy imaging"
repository = "https://github.com/simonwarchol/psudo"
homepage = "https://github.com/simonwarchol/psudo"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = { version = "0.2.88", features = ["serde-serialize"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
ndarray = { version = "0.15", features = ["serde"] }
rayon = "1.8.0"
linfa = "0.7.1"
linfa-clustering = "0.7.1"

statrs = "0.16.0"
imp = "0.1.0"
js-sys = "0.3.64"

getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3.64", features = ["console"]}
ndarray-stats = "0.5.1"
rand = "0.8.5"
palette = "0.7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typenum = "1.17.0"
argmin = "0.8.1"
argmin-math = { version = "0.3", features = ["vec"] }
rust_c3 = "0.3.1"
instant = { version = "0.1", features = [ "wasm-bindgen"]}


rand_xoshiro = "0.6.0"
libc = "0.2.150"

[package.metadata.wasm-pack.profile.release]
# Runtime speed over binary size for interactive palette optimization.
wasm-opt = ["-O3"]

[[example]]
name = "palette_study"
path = "examples/palette_study.rs"

[profile.release]
# Optimize for runtime throughput on color optimization (wasm binary size vs speed tradeoff).
opt-level = 3
